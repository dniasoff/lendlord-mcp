name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lendlord-mcp .
      - name: Smoke test HTTP server
        run: |
          docker run -d --name mcp -p 8080:8080 -e MCP_AUTH_TOKEN=ci-token lendlord-mcp
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp)" = "401"
