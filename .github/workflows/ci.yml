name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Server starts and lists tools
        run: |
          node --input-type=module -e "
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js';
          const c = new Client({ name: 'ci', version: '0' });
          await c.connect(new StdioClientTransport({ command: 'node', args: ['dist/index.js'] }));
          const n = (await c.listTools()).tools.length;
          console.log('tools:', n);
          if (n < 30) process.exit(1);
          await c.close();"
      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
          const files = require('./pack.json')[0].files.map(f => f.path);
          const bad = files.filter(f => /^(test|src|\.env|\.playwright-mcp|captures)\b/.test(f));
          if (bad.length) { console.error('unexpected files in package:', bad); process.exit(1); }
          console.log(files.length, 'files OK');"
      - name: Versions in sync
        run: |
          node -e "
          const pkg = require('./package.json'), srv = require('./server.json');
          const v = [pkg.version, srv.version, srv.packages[0].version];
          if (new Set(v).size !== 1) { console.error('version mismatch', v); process.exit(1); }
          console.log('version', pkg.version);"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t lendlord-mcp .
      - name: Smoke test HTTP server
        run: |
          docker run -d --name mcp -p 8080:8080 -e MCP_AUTH_TOKEN=ci-token lendlord-mcp
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp)" = "401"
