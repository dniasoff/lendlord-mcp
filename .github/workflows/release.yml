name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  target:
    name: Resolve release
    needs: release-please
    if: always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        run: |
          TAG="${{ needs.release-please.outputs.tag || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  docker:
    name: Publish Docker image
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.tag }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          V=${{ needs.target.outputs.version }}
          docker build -t $IMAGE:$V -t $IMAGE:latest .
          docker push $IMAGE:$V
          docker push $IMAGE:latest

  npm:
    name: Publish to npm
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm verifies this workflow, so no token secret is needed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm publish --provenance --access public
